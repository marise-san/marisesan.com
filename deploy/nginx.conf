# /etc/nginx/sites-available/marisesan.com
server {
    listen 80;
    server_name marisesan.com www.marisesan.com;
    root /var/www/marisesan.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
